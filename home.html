<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind and daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inder&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Island+Moments&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Schoolbell&family=Story+Script&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Payoo | Home</title>

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class=" min-h-screen max-w-md mx-auto bg-base-200 px-3">
    <header class=" flex justify-between pt-3.5 border-b-2 border-gray-300">
        <div class=" flex pb-2.5">
            <div class="w-[60px]">
                <img src="./assets/logo.png" alt="">
            </div>
            <div>
                <h1 id="" class=" text-2xl font-bold">$<span id="current-amount">5000</span></h2>
                    <p class=" text-gray-400">Available Balance</p>
            </div>

        </div>
        <a href="./index.html" class="btn"><i class="fa-solid fa-arrow-right-from-bracket"></i>Log out</a>
    </header>

    <section class=" pt-6">
        <h1 class="text-3xl font-bold pb-2">Welcome to Pay<span class=" text-blue-400 ">oo</span></h1>
        <p class=" text-gray-400">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

        <div class=" pt-8 grid grid-cols-3 gap-3">
            <button onclick="showButton ('add-money')" class="btn flex-col py-12 btn-outline btn-primary">
                <img src="./assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button onclick="showButton ('cash-out')" class="btn flex-col py-12 btn-outline btn-primary">
                <img src="./assets/opt-2.png" alt="">
                <p>CashOut</p>
            </button>
            <button onclick="showButton('transfer-money')" class="btn flex-col py-12 btn-outline btn-primary">
                <img src="./assets/opt-3.png" alt="">
                <p>Transfer Money</p>
            </button>
            <button onclick="showButton('bonus-coupon')" class="btn flex-col py-12 btn-outline btn-primary">
                <img src="./assets/opt-4.png" alt="">
                <p> Get Bonus </p>
            </button>
            <button onclick="showButton('pay-money')" class="btn flex-col py-12 btn-outline btn-primary">
                <img src="./assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button onclick="showButton('transaction')" class="btn flex-col py-12 btn-outline btn-primary">
                <img src="./assets/opt-6.png" alt="">
                <p>Transaction</p>
            </button>
        </div>
    </section>

    <section id="cash-out" class="pt-8 hidden">
        <h1 class=" text-2xl pb-2 font-bold">Cash Out</h1>
        <div class="form ">
            <div class="card bg-base-100 w-full  shrink-0  mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-black font-bold">Agent Number</label>
                        <input id="cashout-number" maxlength="11" minlength="11" type="text"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter your Number" />
                        <br>
                        <label class="label text-black font-bold">Amount</label>
                        <input id="cashout-amount" type="number" class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter you amount" />
                        <br>
                        <label class="label text-black font-bold">Pin Number</label>
                        <input id="cashout-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter  pin" />
                        <button id="whithdraw-btn" class="btn btn-neutral mt-4 py-6  bg-primary rounded-full">Withdraw
                            Money</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="add-money" class=" pt-8 hidden">
        <h1 class=" text-2xl pb-2 font-bold">Add Money </h1>
        <div class="form ">
            <div class="card bg-base-100 w-full  shrink-0  mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-black font-bold">Select Bank</label>
                        <select id="bank-select" class="select w-full rounded-full bg-base-200">
                            <option disabled selected>Select bank</option>
                            <option>Islamic</option>
                            <option>Brac</option>
                            <option>Others</option>
                        </select>
                        <br>
                        <label class="label text-black font-bold">Bank Acount Number</label>
                        <input id="bank-number" minlength="11" maxlength="11" type="number"
                            class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter 11 digit bank acount number" />
                        <br>
                        <label class="label text-black font-bold">Amount to Add</label>
                        <input id="add-money-amount" type="number" class="input rounded-full bg-base-200 w-full"
                            placeholder="Add amount to withdraw" />
                        <br>
                        <label class="label text-black font-bold">Pin Number</label>
                        <input id="add-money-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter  pin" />
                        <button id="add-money-btn" class="btn btn-neutral mt-4 py-6  bg-primary rounded-full">Add
                            Money</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="transaction" class=" pt-8 hidden">
        <h1 class=" text-2xl pb-2 font-bold">Transaction History </h1>
        <div id="transection-id" class="  space-y-3">
            <!-- <div id="transection-id" class="bg-base-100 p-2 rounded-[9px] space-y-10">
            </div> -->
        </div>
    </section>

    <section id="transfer-money" class=" pt-8 hidden">
        <h1 class=" text-2xl pb-2 font-bold">Transfer Money </h1>
        <div class="form ">
            <div class="card bg-base-100 w-full  shrink-0  mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-black font-bold">User Acount Number</label>
                        <input id="transfer-number" minlength="11" maxlength="11" type="number"
                            class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter 11 digit bank acount number" />
                        <br>
                        <label class="label text-black font-bold">Amount</label>
                        <input id="transfer-amount" type="number" class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter amount to transfer" />
                        <br>
                        <label class="label text-black font-bold">Pin Number</label>
                        <input id="transfer-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter  pin" />
                        <button  id="transfer" class="btn btn-neutral mt-4 py-6  bg-primary rounded-full">Transfer
                            Money</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="bonus-coupon" class=" pt-8  hidden">
        <h1 class=" text-2xl pb-2 font-bold">Get Bonus </h1>
        <div class="form ">
            <div class="card bg-base-100 w-full  shrink-0  mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-black font-bold">Get Bonus Coupon</label>
                        <input id="bonus-balance"  type="text"
                            class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter your coupon" />
                        <button  id="bonus-btn" class="btn btn-neutral mt-4 py-6  bg-primary rounded-full">Get Bonus</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="pay-money" class=" pt-8 hidden">
        <h1 class=" text-2xl pb-2 font-bold">Pay Bill </h1>
        <div class="form ">
            <div class="card bg-base-100 w-full  shrink-0  mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-black font-bold">Select To Pay</label>
                        <select id="select-bock" class="select w-full rounded-full bg-base-200">
                            <option disabled selected>Select bock</option>
                            <option>wifi</option>
                            <option>water</option>
                            <option>current</option>
                        </select>
                        <br>
                        <label class="label text-black font-bold">Biller Account Number</label>
                        <input id="pay-number" minlength="11" maxlength="11" type="number"
                            class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter acount number" />
                        <br>
                        <label class="label text-black font-bold">Amount to Pay</label>
                        <input id="pay-amount" type="number" class="input rounded-full bg-base-200 w-full"
                            placeholder="Add Amount to Pay" />
                        <br>
                        <label class="label text-black font-bold">Pin Number</label>
                        <input id="pay-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter  pin" />
                        <button id="pay-btn" class="btn btn-neutral mt-4 py-6  bg-primary rounded-full">Pay Bill</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section class=" pt-8  ">
        <h1 class="text-2xl">পবিত্র রমজানের শুভেচ্ছা</h1>
        <p>নিজের প্রিয়জনকে টাকা সেন্ড করুন</p>
    </section>
    

    <script src="./script/addmoney.js"></script>
    <script src="./script/machine.js"></script>
    <script src="./script/cashout.js"></script>
    <script src="./script/transfer.js"></script>
    <script src="./script/bonus.js"></script>
    <script src="./script/pay.js"></script>
</body>

</html>
